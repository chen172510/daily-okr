/* ============================================
   Daily OKR - Brand Design Tokens
   Style: 国风水墨 (Chinese Ink Painting / Jian Lai inspired)
   ============================================ */

:root {
  /* ---------- Ink Palette ---------- */
  --okr-ink-50: #faf8f5;
  --okr-ink-100: #f0ebe3;
  --okr-ink-200: #e0d8cc;
  --okr-ink-300: #c9bda8;
  --okr-ink-400: #a89880;
  --okr-ink-500: #8a7a5e;
  --okr-ink-600: #6b5d44;
  --okr-ink-700: #4f4430;
  --okr-ink-800: #362e1f;
  --okr-ink-900: #1f1a10;

  /* ---------- Rice Paper (宣纸) ---------- */
  --okr-paper-light: #f7f2e8;
  --okr-paper: #ede4d3;
  --okr-paper-dark: #d9cbae;

  /* ---------- Cyan Ink (青黛) ---------- */
  --okr-cyan-100: #e8f1f0;
  --okr-cyan-300: #7fb3ad;
  --okr-cyan-500: #3d7a74;
  --okr-cyan-700: #244f4b;
  --okr-cyan-900: #122b29;

  /* ---------- Gold Accent (描金) ---------- */
  --okr-gold-100: #f7ecd0;
  --okr-gold-300: #e8c97a;
  --okr-gold-500: #c9a227;
  --okr-gold-700: #8b6914;
  --okr-gold-900: #5c4508;

  /* ---------- Vermilion (朱砂) ---------- */
  --okr-vermilion: #c0392b;
  --okr-vermilion-light: #e74c3c;
  --okr-vermilion-dark: #922b21;

  /* ---------- State Colors ---------- */
  --okr-state-success: #2d6a4f;
  --okr-state-success-bg: #d8f3dc;
  --okr-state-warning: #b07d1e;
  --okr-state-warning-bg: #fef3c7;
  --okr-state-error: #922b21;
  --okr-state-error-bg: #fde2e2;

  /* ---------- Semantic Aliases ---------- */
  --okr-background: var(--okr-paper-light);
  --okr-foreground: var(--okr-ink-900);
  --okr-card: #fdfbf5;
  --okr-card-foreground: var(--okr-ink-900);
  --okr-popover: #fdfbf5;
  --okr-popover-foreground: var(--okr-ink-900);
  --okr-primary: var(--okr-ink-800);
  --okr-primary-foreground: var(--okr-paper-light);
  --okr-muted: var(--okr-paper);
  --okr-muted-foreground: var(--okr-ink-500);
  --okr-destructive: var(--okr-vermilion);
  --okr-destructive-foreground: #ffffff;
  --okr-border: var(--okr-ink-200);
  --okr-input: var(--okr-ink-200);
  --okr-ring: var(--okr-ink-700);

  /* ---------- Radius Scale ---------- */
  --okr-radius-sm: 4px;
  --okr-radius-md: 8px;
  --okr-radius-lg: 12px;
  --okr-radius-xl: 16px;
  --okr-radius-full: 9999px;

  /* ---------- Typography ---------- */
  --okr-font-sans: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', 'PingFang SC', 'Microsoft YaHei', serif;
  --okr-font-display: 'Noto Serif SC', 'Source Han Serif SC', 'STKaiti', 'KaiTi', '楷体', serif;
  --okr-font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

  --okr-text-xs: 12px;
  --okr-text-sm: 14px;
  --okr-text-base: 15px;
  --okr-text-lg: 18px;
  --okr-text-xl: 22px;
  --okr-text-2xl: 28px;
  --okr-text-3xl: 36px;
  --okr-text-4xl: 48px;

  /* ---------- Spacing ---------- */
  --okr-space-1: 4px;
  --okr-space-2: 8px;
  --okr-space-3: 12px;
  --okr-space-4: 16px;
  --okr-space-5: 20px;
  --okr-space-6: 24px;
  --okr-space-8: 32px;
  --okr-space-10: 40px;
  --okr-space-12: 48px;
  --okr-space-16: 64px;

  /* ---------- Shadow (subtle ink wash) ---------- */
  --okr-shadow-sm: 0 1px 3px 0 rgba(31, 26, 16, 0.06);
  --okr-shadow-md: 0 4px 8px -2px rgba(31, 26, 16, 0.08);
  --okr-shadow-lg: 0 8px 16px -4px rgba(31, 26, 16, 0.1);
  --okr-shadow-xl: 0 16px 32px -8px rgba(31, 26, 16, 0.12);

  /* ---------- Transition ---------- */
  --okr-transition-fast: 150ms ease;
  --okr-transition-base: 250ms ease;
  --okr-transition-slow: 400ms ease;
}

/* ---------- Base Styles ---------- */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-family: var(--okr-font-sans);
  font-size: var(--okr-text-base);
  line-height: 1.7;
  color: var(--okr-foreground);
  background-color: var(--okr-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at top left, rgba(201, 162, 39, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(61, 122, 116, 0.05) 0%, transparent 50%);
}

/* ---------- Utility Classes ---------- */
.text-primary { color: var(--okr-primary); }
.text-muted { color: var(--okr-muted-foreground); }
.text-gold { color: var(--okr-gold-500); }
.text-vermilion { color: var(--okr-vermilion); }
.text-ink-light { color: var(--okr-ink-500); }

.bg-primary { background-color: var(--okr-primary); }
.bg-card { background-color: var(--okr-card); }
.bg-paper { background-color: var(--okr-paper); }
.bg-muted { background-color: var(--okr-muted); }

.border-default { border-color: var(--okr-border); }
.border-gold { border-color: var(--okr-gold-300); }
.border-ink { border-color: var(--okr-ink-400); }

.rounded-sm { border-radius: var(--okr-radius-sm); }
.rounded-md { border-radius: var(--okr-radius-md); }
.rounded-lg { border-radius: var(--okr-radius-lg); }
.rounded-xl { border-radius: var(--okr-radius-xl); }
.rounded-full { border-radius: var(--okr-radius-full); }

.shadow-sm { box-shadow: var(--okr-shadow-sm); }
.shadow-md { box-shadow: var(--okr-shadow-md); }
.shadow-lg { box-shadow: var(--okr-shadow-lg); }

.transition { transition: all var(--okr-transition-base); }
.transition-fast { transition: all var(--okr-transition-fast); }

/* ---------- Ink decorative helpers ---------- */
.ink-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--okr-ink-300), transparent);
  border: none;
}

.gold-text {
  background: linear-gradient(135deg, var(--okr-gold-300), var(--okr-gold-500), var(--okr-gold-700));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.seal-stamp {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--okr-vermilion);
  color: #fff;
  font-family: var(--okr-font-display);
  font-weight: 700;
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 12px;
  letter-spacing: 2px;
  box-shadow: 0 1px 3px rgba(146, 43, 33, 0.3);
}

<div class="toast" id="toast"></div>

<input type="file" id="fileInput" accept="image/*" style="display:none;">

<script>
(function() {
    'use strict';

    // ========== 状态管理 ==========
    const state = {
        tool: 'rect',           // rect, arrow, pen, text, circle, highlight, number
        color: 'cinnabar',      // cinnabar, gold, ink
        lineWidth: 3,
        lineStyle: 'solid',     // solid, dashed
        annotations: [],        // 标注数组
        history: [],            // 历史记录（用于撤销重做）
        historyIndex: -1,
        selectedId: null,
        imageLoaded: false,
        imgWidth: 0,
        imgHeight: 0,
        imageDataUrl: null,
        nextNumber: 1           // 序号标注计数器
    };

    // 颜色映射
    const colorMap = {
        cinnabar: '#c0392b',
        gold: '#c9a227',
        ink: '#1f1a10'
    };

    const typeNames = {
        rect: '矩形标注',
        arrow: '箭头标注',
        pen: '画笔标注',
        text: '文字标注',
        circle: '圆形标注',
        highlight: '高亮标注',
        number: '序号标注'
    };

    const colorNames = {
        cinnabar: '问题·朱砂',
        gold: '建议·描金',
        ink: '备注·墨色'
    };

    // ========== DOM 元素 ==========
    const uploadArea = document.getElementById('uploadArea');
    const svgContainer = document.getElementById('svgContainer');
    const svg = document.getElementById('annotateSvg');
    const annotationLayer = document.getElementById('annotationLayer');
    const bgImage = document.getElementById('bgImage');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const annotationList = document.getElementById('annotationList');
    const annoCount = document.getElementById('annoCount');
    const fileInput = document.getElementById('fileInput');
    const toastEl = document.getElementById('toast');

    // ========== 工具函数 ==========
    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    function generateId() {
        return 'anno_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    }

    function svgPoint(x, y) {
        const pt = svg.createSVGPoint();
        pt.x = x;
        pt.y = y;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    function dashArray() {
        return state.lineStyle === 'dashed' ? `${state.lineWidth * 3},${state.lineWidth * 2}` : 'none';
    }

    // ========== 历史记录（撤销/重做）==========
    function saveHistory() {
        state.history = state.history.slice(0, state.historyIndex + 1);
        state.history.push(JSON.stringify(state.annotations.map(a => ({
            id: a.id, type: a.type, color: a.color, lineWidth: a.lineWidth,
            lineStyle: a.lineStyle, data: a.data, text: a.text || '',
            numberValue: a.numberValue || 0
        }))));
        state.historyIndex++;
        updateUndoRedoBtns();
    }

    function undo() {
        if (state.historyIndex > 0) {
            state.historyIndex--;
            state.annotations = JSON.parse(state.history[state.historyIndex]).map(a => ({
                ...a, data: {...a.data}, numberValue: a.numberValue || 0
            }));
            state.selectedId = null;
            renderAll();
            updateUndoRedoBtns();
        }
    }

    function redo() {
        if (state.historyIndex < state.history.length - 1) {
            state.historyIndex++;
            state.annotations = JSON.parse(state.history[state.historyIndex]).map(a => ({
                ...a, data: {...a.data}, numberValue: a.numberValue || 0
            }));
            state.selectedId = null;
            renderAll();
            updateUndoRedoBtns();
        }
    }

    function updateUndoRedoBtns() {
        document.getElementById('btnUndo').disabled = state.historyIndex <= 0;
        document.getElementById('btnRedo').disabled = state.historyIndex >= state.history.length - 1;
    }

    // ========== 图片上传 ==========
    function loadImage(src) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
            state.imgWidth = img.naturalWidth;
            state.imgHeight = img.naturalHeight;
            state.imageDataUrl = src;
            state.imageLoaded = true;

            svg.setAttribute('viewBox', `0 0 ${state.imgWidth} ${state.imgHeight}`);
            svg.setAttribute('width', state.imgWidth);
            svg.setAttribute('height', state.imgHeight);
            bgImage.setAttribute('href', src);
            bgImage.setAttribute('width', state.imgWidth);
            bgImage.setAttribute('height', state.imgHeight);

            uploadArea.style.display = 'none';
            svgContainer.style.display = 'flex';
            svgContainer.style.alignItems = 'center';
            svgContainer.style.justifyContent = 'center';

            // 重置标注
            state.annotations = [];
            state.history = [];
            state.historyIndex = -1;
            state.selectedId = null;
            state.nextNumber = 1;
            saveHistory();
            renderAnnotationList();
            showToast('图片加载成功，开始批注吧');
        };
        img.onerror = function() {
            showToast('图片加载失败');
        };
        img.src = src;
    }

    // 点击上传
    uploadArea.addEventListener('click', () => fileInput.click());
    document.getElementById('btnUpload').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            loadImage(ev.target.result);
        };
        reader.readAsDataURL(file);
        fileInput.value = '';
    });

    // 拖拽上传
    uploadArea.addEventListener('dragover', function(e) {
        e.preventDefault();
        uploadArea.classList.add('drag-over');
    });
    uploadArea.addEventListener('dragleave', function() {
        uploadArea.classList.remove('drag-over');
    });
    uploadArea.addEventListener('drop', function(e) {
        e.preventDefault();
        uploadArea.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                loadImage(ev.target.result);
            };
            reader.readAsDataURL(file);
        }
    });

    // 粘贴上传
    document.addEventListener('paste', function(e) {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (let item of items) {
            if (item.type.startsWith('image/')) {
                const file = item.getAsFile();
                const reader = new FileReader();
                reader.onload = function(ev) {
                    loadImage(ev.target.result);
                };
                reader.readAsDataURL(file);
                e.preventDefault();
                break;
            }
        }
    });

    // ========== 工具栏交互 ==========
    // 工具切换
    document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            state.tool = this.dataset.tool;
        });
    });

    // 颜色切换
    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            state.color = this.dataset.color;
        });
    });

    // 线宽切换
    document.querySelectorAll('.line-width-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.line-width-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            state.lineWidth = parseInt(this.dataset.width);
        });
    });

    // 线型切换
    document.querySelectorAll('.line-style-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.line-style-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            state.lineStyle = this.dataset.style;
        });
    });

    // 撤销
    document.getElementById('btnUndo').addEventListener('click', undo);
    // 重做
    document.getElementById('btnRedo').addEventListener('click', redo);
    // 清空
    document.getElementById('btnClear').addEventListener('click', function() {
        if (state.annotations.length === 0) return;
        if (!confirm('确定要清空所有批注吗？')) return;
        state.annotations = [];
        state.selectedId = null;
        state.nextNumber = 1;
        saveHistory();
        renderAll();
        showToast('已清空全部批注');
    });

    // 重置序号
    document.getElementById('btnResetNumber').addEventListener('click', function() {
        state.nextNumber = 1;
        showToast('序号已重置为 1');
    });

    // 模板面板折叠
    document.getElementById('templateHeader').addEventListener('click', function() {
        const body = document.getElementById('templateBody');
        const icon = this.querySelector('.template-toggle-icon');
        body.classList.toggle('collapsed');
        icon.classList.toggle('rotated');
    });

    // 模板 pill 点击
    document.querySelectorAll('.template-pill').forEach(pill => {
        pill.addEventListener('click', function() {
            const text = this.dataset.text;
            if (!state.selectedId) {
                showToast('请先选中一个标注');
                return;
            }
            const anno = state.annotations.find(a => a.id === state.selectedId);
            if (!anno) return;
            if (anno.text) {
                anno.text += '\n' + text;
            } else {
                anno.text = text;
            }
            saveHistory();
            renderAnnotationList();
            // 保持选中
            const item = document.querySelector(`.annotation-item[data-id="${state.selectedId}"]`);
            if (item) item.classList.add('active');
            showToast('已添加模板批注');
        });
    });

    // ========== SVG 绘制交互 ==========
    let isDrawing = false;
    let startX = 0, startY = 0;
    let currentShape = null;
    let penPoints = [];

    svg.addEventListener('mousedown', function(e) {
        if (!state.imageLoaded) return;
        // 如果点击的不是标注层（比如点在了图片上），继续处理
        if (e.target.closest('.annotation-group')) {
            // 点击已有标注，选中它
            const group = e.target.closest('.annotation-group');
            selectAnnotation(group.dataset.id);
            return;
        }
        // 点击空白处，取消选中
        if (state.selectedId) {
            deselectAnnotation();
        }

        const pt = svgPoint(e.clientX, e.clientY);
        startX = pt.x;
        startY = pt.y;
        isDrawing = true;
        penPoints = [];

        const id = generateId();
        const color = colorMap[state.color];
        const lw = state.lineWidth;
        const dash = dashArray();

        if (state.tool === 'rect') {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'annotation-group');
            g.setAttribute('data-id', id);
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('class', 'annotation-shape');
            rect.setAttribute('x', startX);
            rect.setAttribute('y', startY);
            rect.setAttribute('width', 0);
            rect.setAttribute('height', 0);
            rect.setAttribute('fill', 'none');
            rect.setAttribute('stroke', color);
            rect.setAttribute('stroke-width', lw);
            rect.setAttribute('stroke-dasharray', dash);
            rect.setAttribute('rx', 2);
            g.appendChild(rect);
            annotationLayer.appendChild(g);
            currentShape = g;

        } else if (state.tool === 'arrow') {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'annotation-group');
            g.setAttribute('data-id', id);
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('class', 'annotation-shape');
            line.setAttribute('x1', startX);
            line.setAttribute('y1', startY);
            line.setAttribute('x2', startX);
            line.setAttribute('y2', startY);
            line.setAttribute('stroke', color);
            line.setAttribute('stroke-width', lw);
            line.setAttribute('stroke-dasharray', dash);
            line.setAttribute('stroke-linecap', 'round');
            g.appendChild(line);

            // 箭头头部
            const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            arrow.setAttribute('class', 'annotation-shape');
            arrow.setAttribute('fill', color);
            arrow.setAttribute('points', `${startX},${startY} ${startX},${startY} ${startX},${startY}`);
            g.appendChild(arrow);

            annotationLayer.appendChild(g);
            currentShape = g;

        } else if (state.tool === 'pen') {
            penPoints.push([startX, startY]);
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'annotation-group');
            g.setAttribute('data-id', id);
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('class', 'annotation-shape');
            path.setAttribute('d', `M ${startX} ${startY}`);
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', color);
            path.setAttribute('stroke-width', lw);
            path.setAttribute('stroke-dasharray', dash);
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('stroke-linejoin', 'round');
            g.appendChild(path);
            annotationLayer.appendChild(g);
            currentShape = g;

        } else if (state.tool === 'text') {
            // 文字工具：点击后创建输入框
            createTextAnnotation(startX, startY);
            isDrawing = false;

        } else if (state.tool === 'circle') {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'annotation-group');
            g.setAttribute('data-id', id);
            const ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
            ellipse.setAttribute('class', 'annotation-shape');
            ellipse.setAttribute('cx', startX);
            ellipse.setAttribute('cy', startY);
            ellipse.setAttribute('rx', 0);
            ellipse.setAttribute('ry', 0);
            ellipse.setAttribute('fill', 'none');
            ellipse.setAttribute('stroke', color);
            ellipse.setAttribute('stroke-width', lw);
            ellipse.setAttribute('stroke-dasharray', dash);
            g.appendChild(ellipse);
            annotationLayer.appendChild(g);
            currentShape = g;

        } else if (state.tool === 'highlight') {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'annotation-group');
            g.setAttribute('data-id', id);
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('class', 'annotation-shape');
            rect.setAttribute('x', startX);
            rect.setAttribute('y', startY);
            rect.setAttribute('width', 0);
            rect.setAttribute('height', 0);
            rect.setAttribute('fill', color);
            rect.setAttribute('fill-opacity', '0.25');
            rect.setAttribute('stroke', color);
            rect.setAttribute('stroke-width', 1);
            rect.setAttribute('stroke-dasharray', 'none');
            rect.setAttribute('rx', 2);
            g.appendChild(rect);
            annotationLayer.appendChild(g);
            currentShape = g;

        } else if (state.tool === 'number') {
            // 序号工具：点击放置带数字的圆
            createNumberAnnotation(startX, startY);
            isDrawing = false;
        }
    });

    svg.addEventListener('mousemove', function(e) {
        if (!isDrawing || !currentShape) return;
        const pt = svgPoint(e.clientX, e.clientY);
        const x = pt.x, y = pt.y;

        if (state.tool === 'rect') {
            const rect = currentShape.querySelector('rect');
            const rx = Math.min(startX, x);
            const ry = Math.min(startY, y);
            const rw = Math.abs(x - startX);
            const rh = Math.abs(y - startY);
            rect.setAttribute('x', rx);
            rect.setAttribute('y', ry);
            rect.setAttribute('width', rw);
            rect.setAttribute('height', rh);

        } else if (state.tool === 'arrow') {
            const line = currentShape.querySelector('line');
            line.setAttribute('x2', x);
            line.setAttribute('y2', y);

            // 计算箭头头部
            const angle = Math.atan2(y - startY, x - startX);
            const headLen = 12 + state.lineWidth * 2;
            const headAngle = Math.PI / 6;
            const p1x = x - headLen * Math.cos(angle - headAngle);
            const p1y = y - headLen * Math.sin(angle - headAngle);
            const p2x = x - headLen * Math.cos(angle + headAngle);
            const p2y = y - headLen * Math.sin(angle + headAngle);
            const arrow = currentShape.querySelector('polygon');
            arrow.setAttribute('points', `${x},${y} ${p1x},${p1y} ${p2x},${p2y}`);

        } else if (state.tool === 'pen') {
            penPoints.push([x, y]);
            const path = currentShape.querySelector('path');
            let d = `M ${penPoints[0][0]} ${penPoints[0][1]}`;
            for (let i = 1; i < penPoints.length; i++) {
                d += ` L ${penPoints[i][0]} ${penPoints[i][1]}`;
            }
            path.setAttribute('d', d);

        } else if (state.tool === 'circle') {
            const ellipse = currentShape.querySelector('ellipse');
            const cx = (startX + x) / 2;
            const cy = (startY + y) / 2;
            const rx = Math.abs(x - startX) / 2;
            const ry = Math.abs(y - startY) / 2;
            ellipse.setAttribute('cx', cx);
            ellipse.setAttribute('cy', cy);
            ellipse.setAttribute('rx', rx);
            ellipse.setAttribute('ry', ry);

        } else if (state.tool === 'highlight') {
            const rect = currentShape.querySelector('rect');
            const rx = Math.min(startX, x);
            const ry = Math.min(startY, y);
            const rw = Math.abs(x - startX);
            const rh = Math.abs(y - startY);
            rect.setAttribute('x', rx);
            rect.setAttribute('y', ry);
            rect.setAttribute('width', rw);
            rect.setAttribute('height', rh);
        }
    });

    svg.addEventListener('mouseup', function(e) {
        if (!isDrawing || !currentShape) return;
        isDrawing = false;

        const id = currentShape.dataset.id;
        const pt = svgPoint(e.clientX, e.clientY);
        let data = {};

        if (state.tool === 'rect') {
            const rect = currentShape.querySelector('rect');
            const w = parseFloat(rect.getAttribute('width'));
            const h = parseFloat(rect.getAttribute('height'));
            if (w < 5 || h < 5) {
                currentShape.remove();
                currentShape = null;
                return;
            }
            data = {
                x: parseFloat(rect.getAttribute('x')),
                y: parseFloat(rect.getAttribute('y')),
                width: w,
                height: h
            };
        } else if (state.tool === 'arrow') {
            const line = currentShape.querySelector('line');
            data = {
                x1: parseFloat(line.getAttribute('x1')),
                y1: parseFloat(line.getAttribute('y1')),
                x2: parseFloat(line.getAttribute('x2')),
                y2: parseFloat(line.getAttribute('y2'))
            };
            const dx = data.x2 - data.x1;
            const dy = data.y2 - data.y1;
            if (Math.sqrt(dx*dx + dy*dy) < 10) {
                currentShape.remove();
                currentShape = null;
                return;
            }
        } else if (state.tool === 'pen') {
            if (penPoints.length < 2) {
                currentShape.remove();
                currentShape = null;
                return;
            }
            data = { points: [...penPoints] };

        } else if (state.tool === 'circle') {
            const ellipse = currentShape.querySelector('ellipse');
            const rx = parseFloat(ellipse.getAttribute('rx'));
            const ry = parseFloat(ellipse.getAttribute('ry'));
            if (rx < 5 || ry < 5) {
                currentShape.remove();
                currentShape = null;
                return;
            }
            data = {
                cx: parseFloat(ellipse.getAttribute('cx')),
                cy: parseFloat(ellipse.getAttribute('cy')),
                rx: rx,
                ry: ry
            };

        } else if (state.tool === 'highlight') {
            const rect = currentShape.querySelector('rect');
            const w = parseFloat(rect.getAttribute('width'));
            const h = parseFloat(rect.getAttribute('height'));
            if (w < 5 || h < 5) {
                currentShape.remove();
                currentShape = null;
                return;
            }
            data = {
                x: parseFloat(rect.getAttribute('x')),
                y: parseFloat(rect.getAttribute('y')),
                width: w,
                height: h
            };
        }

        // 添加编号标签
        const labelNum = state.annotations.length + 1;
        addAnnotationLabel(currentShape, state.tool, data, labelNum);

        // 保存标注数据
        const annotation = {
            id: id,
            type: state.tool,
            color: state.color,
            lineWidth: state.lineWidth,
            lineStyle: state.lineStyle,
            data: data,
            text: '',
            labelNum: labelNum
        };
        state.annotations.push(annotation);
        saveHistory();

        currentShape = null;
        penPoints = [];
        selectAnnotation(id);
        renderAnnotationList();
    });

    // 鼠标离开取消绘制
    svg.addEventListener('mouseleave', function() {
        if (isDrawing && currentShape) {
            currentShape.remove();
            currentShape = null;
            isDrawing = false;
            penPoints = [];
        }
    });

    // 添加编号标签
    function addAnnotationLabel(group, type, data, num) {
        const color = colorMap[state.color];
        let lx, ly;
        if (type === 'rect') {
            lx = data.x - 2;
            ly = data.y - 2;
        } else if (type === 'arrow') {
            lx = data.x2 + 8;
            ly = data.y2 - 8;
        } else if (type === 'pen') {
            const pts = data.points;
            lx = pts[pts.length - 1][0] + 8;
            ly = pts[pts.length - 1][1] - 8;
        } else if (type === 'circle') {
            lx = data.cx - data.rx;
            ly = data.cy - data.ry;
        } else if (type === 'highlight') {
            lx = data.x - 2;
            ly = data.y - 2;
        } else {
            return;
        }

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'anno-label-group');

        // 背景圆
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', lx);
        circle.setAttribute('cy', ly);
        circle.setAttribute('r', 10);
        circle.setAttribute('fill', color);
        circle.setAttribute('stroke', '#fdfbf5');
        circle.setAttribute('stroke-width', 1.5);
        g.appendChild(circle);

        // 编号文字
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', lx);
        text.setAttribute('y', ly);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', '#fff');
        text.setAttribute('class', 'anno-label');
        text.textContent = num;
        g.appendChild(text);

        group.appendChild(g);
    }

    // ========== 序号标注 ==========
    function createNumberAnnotation(x, y) {
        const id = generateId();
        const color = colorMap[state.color];
        const num = state.nextNumber;
        const radius = 14;

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'annotation-group');
        g.setAttribute('data-id', id);

        // 背景圆（朱砂色）
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('class', 'annotation-shape number-badge');
        circle.setAttribute('cx', x);
        circle.setAttribute('cy', y);
        circle.setAttribute('r', radius);
        circle.setAttribute('fill', '#c0392b');
        circle.setAttribute('stroke', '#fdfbf5');
        circle.setAttribute('stroke-width', 2);
        g.appendChild(circle);

        // 数字
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('class', 'annotation-shape');
        text.setAttribute('x', x);
        text.setAttribute('y', y);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', '#fff');
        text.setAttribute('font-family', '"STKaiti", "KaiTi", "楷体", serif');
        text.setAttribute('font-size', '14px');
        text.setAttribute('font-weight', '700');
        text.textContent = num;
        g.appendChild(text);

        annotationLayer.appendChild(g);

        const annotation = {
            id: id,
            type: 'number',
            color: state.color,
            lineWidth: state.lineWidth,
            lineStyle: state.lineStyle,
            data: { x: x, y: y, radius: radius },
            text: '',
            numberValue: num,
            labelNum: state.annotations.length + 1
        };
        state.annotations.push(annotation);
        state.nextNumber++;
        saveHistory();
        selectAnnotation(id);
        renderAnnotationList();
    }

    // ========== 文字标注 ==========
    function createTextAnnotation(x, y) {
        const id = generateId();
        const color = colorMap[state.color];

        // 创建输入框
        const input = document.createElement('textarea');
        input.className = 'text-annotation-input';
        input.style.left = (svgContainer.offsetLeft + x - 40) + 'px';
        input.style.top = (svgContainer.offsetTop + y - 20) + 'px';
        input.placeholder = '输入文字...';
        input.style.color = color;
        canvasWrapper.appendChild(input);
        input.focus();

        function finishText() {
            const txt = input.value.trim();
            input.remove();
            if (!txt) return;

            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'annotation-group');
            g.setAttribute('data-id', id);

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('class', 'annotation-shape');
            text.setAttribute('x', x);
            text.setAttribute('y', y);
            text.setAttribute('fill', color);
            text.setAttribute('font-size', 16 + state.lineWidth * 2);
            text.setAttribute('font-family', '"STKaiti", "KaiTi", "楷体", serif');
            text.setAttribute('font-weight', '600');
            text.setAttribute('paint-order', 'stroke');
            text.setAttribute('stroke', 'rgba(253,251,245,0.9)');
            text.setAttribute('stroke-width', '3');
            text.setAttribute('stroke-linejoin', 'round');
            text.textContent = txt;
            g.appendChild(text);

            annotationLayer.appendChild(g);

            const annotation = {
                id: id,
                type: 'text',
                color: state.color,
                lineWidth: state.lineWidth,
                lineStyle: state.lineStyle,
                data: { x: x, y: y, content: txt },
                text: '',
                labelNum: state.annotations.length + 1
            };
            state.annotations.push(annotation);
            saveHistory();
            selectAnnotation(id);
            renderAnnotationList();
        }

        input.addEventListener('blur', finishText);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                input.value = '';
                input.blur();
            }
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                input.blur();
            }
        });
    }

    // ========== 选中标注 ==========
    function selectAnnotation(id) {
        state.selectedId = id;
        // 更新 SVG 选中态
        document.querySelectorAll('.annotation-group').forEach(g => {
            g.classList.toggle('selected', g.dataset.id === id);
        });
        // 更新列表选中态
        document.querySelectorAll('.annotation-item').forEach(item => {
            item.classList.toggle('active', item.dataset.id === id);
        });

        // 滚动到对应列表项
        const item = document.querySelector(`.annotation-item[data-id="${id}"]`);
        if (item) {
            item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    function deselectAnnotation() {
        state.selectedId = null;
        document.querySelectorAll('.annotation-group').forEach(g => g.classList.remove('selected'));
        document.querySelectorAll('.annotation-item').forEach(item => item.classList.remove('active'));
    }

    // 点击空白处取消选中
    canvasWrapper.addEventListener('click', function(e) {
        if (e.target === canvasWrapper || e.target === svgContainer || e.target === svg || e.target.tagName === 'image') {
            deselectAnnotation();
        }
    });

    // ========== 渲染全部 ==========
    function renderAll() {
        // 清空 SVG 标注层（保留 image）
        while (annotationLayer.firstChild) {
            annotationLayer.removeChild(annotationLayer.firstChild);
        }

        // 重新渲染所有标注
        state.annotations.forEach((anno, idx) => {
            anno.labelNum = idx + 1;
            const color = colorMap[anno.color];
            const lw = anno.lineWidth;
            const dash = anno.lineStyle === 'dashed' ? `${lw * 3},${lw * 2}` : 'none';

            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'annotation-group' + (anno.id === state.selectedId ? ' selected' : ''));
            g.setAttribute('data-id', anno.id);

            if (anno.type === 'rect') {
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('class', 'annotation-shape');
                rect.setAttribute('x', anno.data.x);
                rect.setAttribute('y', anno.data.y);
                rect.setAttribute('width', anno.data.width);
                rect.setAttribute('height', anno.data.height);
                rect.setAttribute('fill', 'none');
                rect.setAttribute('stroke', color);
                rect.setAttribute('stroke-width', lw);
                rect.setAttribute('stroke-dasharray', dash);
                rect.setAttribute('rx', 2);
                g.appendChild(rect);
                addAnnotationLabel(g, 'rect', anno.data, idx + 1);

            } else if (anno.type === 'arrow') {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('class', 'annotation-shape');
                line.setAttribute('x1', anno.data.x1);
                line.setAttribute('y1', anno.data.y1);
                line.setAttribute('x2', anno.data.x2);
                line.setAttribute('y2', anno.data.y2);
                line.setAttribute('stroke', color);
                line.setAttribute('stroke-width', lw);
                line.setAttribute('stroke-dasharray', dash);
                line.setAttribute('stroke-linecap', 'round');
                g.appendChild(line);

                const angle = Math.atan2(anno.data.y2 - anno.data.y1, anno.data.x2 - anno.data.x1);
                const headLen = 12 + lw * 2;
                const headAngle = Math.PI / 6;
                const p1x = anno.data.x2 - headLen * Math.cos(angle - headAngle);
                const p1y = anno.data.y2 - headLen * Math.sin(angle - headAngle);
                const p2x = anno.data.x2 - headLen * Math.cos(angle + headAngle);
                const p2y = anno.data.y2 - headLen * Math.sin(angle + headAngle);
                const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                arrow.setAttribute('class', 'annotation-shape');
                arrow.setAttribute('fill', color);
                arrow.setAttribute('points', `${anno.data.x2},${anno.data.y2} ${p1x},${p1y} ${p2x},${p2y}`);
                g.appendChild(arrow);

                addAnnotationLabel(g, 'arrow', anno.data, idx + 1);

            } else if (anno.type === 'pen') {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('class', 'annotation-shape');
                let d = `M ${anno.data.points[0][0]} ${anno.data.points[0][1]}`;
                for (let i = 1; i < anno.data.points.length; i++) {
                    d += ` L ${anno.data.points[i][0]} ${anno.data.points[i][1]}`;
                }
                path.setAttribute('d', d);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', color);
                path.setAttribute('stroke-width', lw);
                path.setAttribute('stroke-dasharray', dash);
                path.setAttribute('stroke-linecap', 'round');
                path.setAttribute('stroke-linejoin', 'round');
                g.appendChild(path);
                addAnnotationLabel(g, 'pen', anno.data, idx + 1);

            } else if (anno.type === 'text') {
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('class', 'annotation-shape');
                text.setAttribute('x', anno.data.x);
                text.setAttribute('y', anno.data.y);
                text.setAttribute('fill', color);
                text.setAttribute('font-size', 16 + lw * 2);
                text.setAttribute('font-family', '"STKaiti", "KaiTi", "楷体", serif');
                text.setAttribute('font-weight', '600');
                text.setAttribute('paint-order', 'stroke');
                text.setAttribute('stroke', 'rgba(253,251,245,0.9)');
                text.setAttribute('stroke-width', '3');
                text.setAttribute('stroke-linejoin', 'round');
                text.textContent = anno.data.content;
                g.appendChild(text);

            } else if (anno.type === 'circle') {
                const ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
                ellipse.setAttribute('class', 'annotation-shape');
                ellipse.setAttribute('cx', anno.data.cx);
                ellipse.setAttribute('cy', anno.data.cy);
                ellipse.setAttribute('rx', anno.data.rx);
                ellipse.setAttribute('ry', anno.data.ry);
                ellipse.setAttribute('fill', 'none');
                ellipse.setAttribute('stroke', color);
                ellipse.setAttribute('stroke-width', lw);
                ellipse.setAttribute('stroke-dasharray', dash);
                g.appendChild(ellipse);
                addAnnotationLabel(g, 'circle', anno.data, idx + 1);

            } else if (anno.type === 'highlight') {
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('class', 'annotation-shape');
                rect.setAttribute('x', anno.data.x);
                rect.setAttribute('y', anno.data.y);
                rect.setAttribute('width', anno.data.width);
                rect.setAttribute('height', anno.data.height);
                rect.setAttribute('fill', color);
                rect.setAttribute('fill-opacity', '0.25');
                rect.setAttribute('stroke', color);
                rect.setAttribute('stroke-width', 1);
                rect.setAttribute('rx', 2);
                g.appendChild(rect);
                addAnnotationLabel(g, 'highlight', anno.data, idx + 1);

            } else if (anno.type === 'number') {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('class', 'annotation-shape number-badge');
                circle.setAttribute('cx', anno.data.x);
                circle.setAttribute('cy', anno.data.y);
                circle.setAttribute('r', anno.data.radius);
                circle.setAttribute('fill', '#c0392b');
                circle.setAttribute('stroke', '#fdfbf5');
                circle.setAttribute('stroke-width', 2);
                g.appendChild(circle);

                const numText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                numText.setAttribute('class', 'annotation-shape');
                numText.setAttribute('x', anno.data.x);
                numText.setAttribute('y', anno.data.y);
                numText.setAttribute('text-anchor', 'middle');
                numText.setAttribute('dominant-baseline', 'central');
                numText.setAttribute('fill', '#fff');
                numText.setAttribute('font-family', '"STKaiti", "KaiTi", "楷体", serif');
                numText.setAttribute('font-size', '14px');
                numText.setAttribute('font-weight', '700');
                numText.textContent = anno.numberValue;
                g.appendChild(numText);
            }

            annotationLayer.appendChild(g);
        });

        renderAnnotationList();
    }

    // ========== 渲染标注列表 ==========
    function renderAnnotationList() {
        annoCount.textContent = state.annotations.length;

        if (state.annotations.length === 0) {
            annotationList.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <p>暂无批注</p>
                    <p style="font-size:12px; margin-top:4px; opacity:0.7;">上传图片后开始圈点</p>
                </div>
            `;
            return;
        }

        annotationList.innerHTML = state.annotations.map((anno, idx) => {
            const displayNum = anno.type === 'number' ? anno.numberValue : (idx + 1);
            return `
            <div class="annotation-item ${anno.id === state.selectedId ? 'active' : ''}" data-id="${anno.id}">
                <div class="anno-item-header">
                    <div class="anno-number ${anno.color}">${displayNum}</div>
                    <span class="anno-type">${typeNames[anno.type]} · ${colorNames[anno.color]}</span>
                    <button class="anno-delete" data-id="${anno.id}" title="删除">
                        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </div>
                <div class="anno-text" data-id="${anno.id}">${anno.text || ''}</div>
            </div>
        `;}).join('');

        // 绑定事件
        annotationList.querySelectorAll('.annotation-item').forEach(item => {
            item.addEventListener('click', function(e) {
                if (e.target.closest('.anno-delete')) return;
                if (e.target.classList.contains('anno-text')) return;
                selectAnnotation(this.dataset.id);
            });
        });

        annotationList.querySelectorAll('.anno-delete').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                deleteAnnotation(this.dataset.id);
            });
        });

        annotationList.querySelectorAll('.anno-text').forEach(el => {
            el.addEventListener('click', function() {
                const id = this.dataset.id;
                selectAnnotation(id);
                openTextEditor(id, this);
            });
        });
    }

    // 删除标注
    function deleteAnnotation(id) {
        state.annotations = state.annotations.filter(a => a.id !== id);
        if (state.selectedId === id) state.selectedId = null;
        saveHistory();
        renderAll();
        showToast('已删除批注');
    }

    // 打开文字编辑器
    function openTextEditor(id, el) {
        const anno = state.annotations.find(a => a.id === id);
        if (!anno) return;

        const textarea = document.createElement('textarea');
        textarea.className = 'anno-text-input';
        textarea.value = anno.text || '';
        textarea.placeholder = '输入修改建议...';
        el.replaceWith(textarea);
        textarea.focus();
        textarea.select();

        function save() {
            const txt = textarea.value.trim();
            anno.text = txt;
            saveHistory();
            renderAnnotationList();
            // 保持选中
            const item = document.querySelector(`.annotation-item[data-id="${id}"]`);
            if (item) item.classList.add('active');
        }

        textarea.addEventListener('blur', save);
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                textarea.blur();
            }
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                textarea.blur();
            }
        });
    }

    // ========== 导出功能 ==========
    // 合成带标注的 Canvas
    function buildCompositedCanvas(callback) {
        const canvas = document.createElement('canvas');
        canvas.width = state.imgWidth;
        canvas.height = state.imgHeight;
        const ctx = canvas.getContext('2d');

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
            ctx.drawImage(img, 0, 0);

            // 绘制所有标注
            state.annotations.forEach((anno, idx) => {
                const color = colorMap[anno.color];
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = anno.lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                if (anno.lineStyle === 'dashed') {
                    ctx.setLineDash([anno.lineWidth * 3, anno.lineWidth * 2]);
                } else {
                    ctx.setLineDash([]);
                }

                if (anno.type === 'rect') {
                    ctx.strokeRect(anno.data.x, anno.data.y, anno.data.width, anno.data.height);
                    drawLabel(ctx, anno.data.x - 2, anno.data.y - 2, idx + 1, color);
                } else if (anno.type === 'arrow') {
                    // 画箭线
                    ctx.beginPath();
                    ctx.moveTo(anno.data.x1, anno.data.y1);
                    ctx.lineTo(anno.data.x2, anno.data.y2);
                    ctx.stroke();

                    // 画箭头
                    const angle = Math.atan2(anno.data.y2 - anno.data.y1, anno.data.x2 - anno.data.x1);
                    const headLen = 12 + anno.lineWidth * 2;
                    const headAngle = Math.PI / 6;
                    ctx.beginPath();
                    ctx.moveTo(anno.data.x2, anno.data.y2);
                    ctx.lineTo(anno.data.x2 - headLen * Math.cos(angle - headAngle), anno.data.y2 - headLen * Math.sin(angle - headAngle));
                    ctx.lineTo(anno.data.x2 - headLen * Math.cos(angle + headAngle), anno.data.y2 - headLen * Math.sin(angle + headAngle));
                    ctx.closePath();
                    ctx.fill();

                    drawLabel(ctx, anno.data.x2 + 8, anno.data.y2 - 8, idx + 1, color);
                } else if (anno.type === 'pen') {
                    ctx.beginPath();
                    const pts = anno.data.points;
                    ctx.moveTo(pts[0][0], pts[0][1]);
                    for (let i = 1; i < pts.length; i++) {
                        ctx.lineTo(pts[i][0], pts[i][1]);
                    }
                    ctx.stroke();
                    const last = pts[pts.length - 1];
                    drawLabel(ctx, last[0] + 8, last[1] - 8, idx + 1, color);
                } else if (anno.type === 'text') {
                    ctx.setLineDash([]);
                    ctx.font = `600 ${16 + anno.lineWidth * 2}px "STKaiti", "KaiTi", "楷体", serif`;
                    ctx.textBaseline = 'alphabetic';
                    // 文字描边
                    ctx.strokeStyle = 'rgba(253,251,245,0.9)';
                    ctx.lineWidth = 4;
                    ctx.strokeText(anno.data.content, anno.data.x, anno.data.y);
                    ctx.fillStyle = color;
                    ctx.fillText(anno.data.content, anno.data.x, anno.data.y);

                } else if (anno.type === 'circle') {
                    ctx.beginPath();
                    ctx.ellipse(anno.data.cx, anno.data.cy, anno.data.rx, anno.data.ry, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    drawLabel(ctx, anno.data.cx - anno.data.rx, anno.data.cy - anno.data.ry, idx + 1, color);

                } else if (anno.type === 'highlight') {
                    ctx.setLineDash([]);
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.25;
                    ctx.fillRect(anno.data.x, anno.data.y, anno.data.width, anno.data.height);
                    ctx.globalAlpha = 1;
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(anno.data.x, anno.data.y, anno.data.width, anno.data.height);
                    drawLabel(ctx, anno.data.x - 2, anno.data.y - 2, idx + 1, color);

                } else if (anno.type === 'number') {
                    ctx.setLineDash([]);
                    ctx.beginPath();
                    ctx.arc(anno.data.x, anno.data.y, anno.data.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#c0392b';
                    ctx.fill();
                    ctx.strokeStyle = '#fdfbf5';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.font = '700 14px "STKaiti", "KaiTi", "楷体", serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(String(anno.numberValue), anno.data.x, anno.data.y);
                }
            });

            callback(canvas);
        };
        img.onerror = function() {
            showToast('图片加载失败');
        };
        img.src = state.imageDataUrl;
    }

    // 导出图片（Canvas 合成）
    document.getElementById('btnExportImage').addEventListener('click', function() {
        if (!state.imageLoaded) {
            showToast('请先上传图片');
            return;
        }
        if (state.annotations.length === 0) {
            showToast('暂无批注可导出');
            return;
        }

        buildCompositedCanvas(function(canvas) {
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '标注图_' + new Date().toLocaleDateString('zh-CN').replace(/\//g, '-') + '.png';
                a.click();
                URL.revokeObjectURL(url);
                showToast('图片已导出');
            }, 'image/png');
        });
    });

    // 复制到剪贴板
    document.getElementById('btnCopyImage').addEventListener('click', function() {
        if (!state.imageLoaded) {
            showToast('请先上传图片');
            return;
        }
        if (state.annotations.length === 0) {
            showToast('暂无批注可复制');
            return;
        }

        buildCompositedCanvas(function(canvas) {
            canvas.toBlob(function(blob) {
                if (!blob) {
                    showToast('复制失败');
                    return;
                }
                try {
                    navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]).then(function() {
                        showToast('已复制到剪贴板');
                    }).catch(function() {
                        showToast('复制失败，请重试');
                    });
                } catch (e) {
                    showToast('当前浏览器不支持复制图片');
                }
            }, 'image/png');
        });
    });

    function drawLabel(ctx, x, y, num, color) {
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#fdfbf5';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "STKaiti", "KaiTi", "楷体", serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(num), x, y);
    }

    // 导出 Markdown
    document.getElementById('btnExportMarkdown').addEventListener('click', function() {
        if (state.annotations.length === 0) {
            showToast('暂无批注可导出');
            return;
        }

        let md = '# 标注说明\n\n';
        md += '> 生成时间：' + new Date().toLocaleString('zh-CN') + '\n\n';
        md += '---\n\n';
        md += '## 截图参考\n\n';
        md += '![标注截图](标注图_' + new Date().toLocaleDateString('zh-CN').replace(/\//g, '-') + '.png)\n\n';
        md += '---\n\n';

        state.annotations.forEach((anno, idx) => {
            const iconMap = {
                rect: '🔲', arrow: '➡️', pen: '✏️', text: '📝',
                circle: '⭕', highlight: '🖍️', number: '🔢'
            };
            const icon = iconMap[anno.type] || '📍';
            const typeLabel = typeNames[anno.type] || '标注';
            const numDisplay = anno.type === 'number' ? `（序号 ${anno.numberValue}）` : '';
            md += `## ${idx + 1}. ${icon} ${typeLabel}${numDisplay} · ${colorNames[anno.color]}\n\n`;
            if (anno.type === 'text') {
                md += `**内容**：${anno.data.content}\n\n`;
            }
            if (anno.text) {
                md += `**修改建议**：\n\n${anno.text}\n\n`;
            } else {
                md += `*（暂无修改建议）*\n\n`;
            }
            md += '---\n\n';
        });

        // 下载
        const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '标注说明_' + new Date().toLocaleDateString('zh-CN').replace(/\//g, '-') + '.md';
        a.click();
        URL.revokeObjectURL(url);
        showToast('标注说明已导出');
    });

    // ========== 实时时间 ==========
    (function() {
        function updateTime() {
            const now = new Date();
            const h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const shichen = [
                ['子时', 23, 1], ['丑时', 1, 3], ['寅时', 3, 5],
                ['卯时', 5, 7], ['辰时', 7, 9], ['巳时', 9, 11],
                ['午时', 11, 13], ['未时', 13, 15], ['申时', 15, 17],
                ['酉时', 17, 19], ['戌时', 19, 21], ['亥时', 21, 23]
            ];
            let currentShichen = '子时';
            for (let s of shichen) {
                if (s[1] < s[2]) {
                    if (h >= s[1] && h < s[2]) { currentShichen = s[0]; break; }
                } else {
                    if (h >= s[1] || h < s[2]) { currentShichen = s[0]; break; }
                }
            }
            const timeEl = document.getElementById('topbarTime');
            if (timeEl) timeEl.textContent = currentShichen + ' · ' + String(h).padStart(2, '0') + ':' + m;

            const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            const dateEl = document.getElementById('sidebarDate');
            const weekdayEl = document.getElementById('sidebarWeekday');
            if (dateEl) dateEl.textContent = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';
            if (weekdayEl) weekdayEl.textContent = weekdays[now.getDay()];
        }
        updateTime();
        setInterval(updateTime, 60000);
    })();

    // 快捷键
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        // Ctrl+Z 撤销
        if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
            e.preventDefault();
            undo();
        }
        // Ctrl+Shift+Z / Ctrl+Y 重做
        if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
            e.preventDefault();
            redo();
        }
        // Delete 删除选中
        if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedId) {
            e.preventDefault();
            deleteAnnotation(state.selectedId);
        }
        // 工具快捷键
        if (e.key === 'r' || e.key === 'R') {
            document.querySelector('.tool-btn[data-tool="rect"]').click();
        } else if (e.key === 'a' || e.key === 'A') {
            document.querySelector('.tool-btn[data-tool="arrow"]').click();
        } else if (e.key === 'p' || e.key === 'P') {
            document.querySelector('.tool-btn[data-tool="pen"]').click();
        } else if (e.key === 't' || e.key === 'T') {
            document.querySelector('.tool-btn[data-tool="text"]').click();
        } else if (e.key === 'c' || e.key === 'C') {
            document.querySelector('.tool-btn[data-tool="circle"]').click();
        } else if (e.key === 'h' || e.key === 'H') {
            document.querySelector('.tool-btn[data-tool="highlight"]').click();
        } else if (e.key === 'n' || e.key === 'N') {
            document.querySelector('.tool-btn[data-tool="number"]').click();
        }
    });

})();
</script>

.anno-number.cinnabar { background: var(--ink-cinnabar); }

@media (max-width: 1200px) {
  body { overflow-x: auto; }
}
